# GitHub Actions workflow to build and deploy MkDocs to GitHub Pages
name: Deploy Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'tutorials/**'
      - 'poc-agenda/**'
      # Source README changes still trigger a build, but are not copied by CI.
      # Update the corresponding committed docs/ pages in the same change.
      - 'notebooks/**/README.md'
      - 'infra/README.md'
      - 'mkdocs.yml'
      # Build-time hooks and theme overrides change the rendered HTML, so a
      # change to either must rebuild the docs (previously omitted — so a
      # hooks/ or overrides/ fix never published without a manual dispatch).
      - 'hooks/**'
      - 'overrides/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for git info

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Single source of truth for docs deps — keeps CI in step with local
          # builds. A hardcoded list here previously drifted and dropped
          # mkdocs-redirects, which aborts the build as a config error.
          pip install -r requirements-docs.txt
          pip install linkchecker

      - name: Verify documentation structure
        run: |
          echo "📁 Documentation content is committed under docs/ (single source of truth)."
          echo "No CI-time copy step is required — local and CI builds are identical."

          # List the docs structure for debugging
          echo ""
          echo "📂 Documentation structure:"
          find docs -type f -name "*.md" | head -50
          echo "..."
          echo "Total markdown files: $(find docs -type f -name '*.md' | wc -l)"

      - name: Validate internal links
        run: |
          echo "🔗 Checking for broken internal links..."

          # Check for common link issues in markdown files
          broken_links=0

          # Check for links to non-existent files
          for file in $(find docs -name "*.md"); do
            # Extract markdown links [text](path)
            links=$(grep -oP '\[.*?\]\(\K[^)]+(?=\))' "$file" 2>/dev/null || true)
            for link in $links; do
              # Skip external links, anchors, and mailto
              if [[ "$link" == http* ]] || [[ "$link" == \#* ]] || [[ "$link" == mailto:* ]]; then
                continue
              fi

              # Get the directory of the current file
              dir=$(dirname "$file")

              # Remove anchor from link
              link_path="${link%%#*}"

              # Skip if empty after removing anchor
              if [[ -z "$link_path" ]]; then
                continue
              fi

              # Check if the linked file exists
              if [[ "$link_path" == /* ]]; then
                # Absolute path (from docs root)
                target="docs${link_path}"
              else
                # Relative path
                target="$dir/$link_path"
              fi

              # Normalize path
              target=$(realpath -m "$target" 2>/dev/null || echo "$target")

              if [[ ! -f "$target" ]] && [[ ! -d "$target" ]]; then
                echo "❌ Broken link in $file: $link -> $target"
                broken_links=$((broken_links + 1))
              fi
            done
          done

          if [[ $broken_links -gt 0 ]]; then
            echo ""
            echo "⚠️ Found $broken_links potentially broken links"
            echo "Note: Some may be valid if they reference generated content"
          else
            echo "✅ No obvious broken internal links found"
          fi

      - name: Build documentation
        run: |
          echo "🏗️ Building documentation with MkDocs..."
          # Note: Not using --strict because some legacy links reference
          # files outside the docs folder. Link validation is done in a
          # separate step that reports but doesn't fail the build.
          mkdocs build
          echo "✅ Build completed successfully"

      - name: Validate built site
        run: |
          echo "🔍 Validating built site structure..."

          # Check that key pages exist
          required_pages=(
            "site/index.html"
            "site/QUICK_START/index.html"
            "site/tutorials/index.html"
            "site/best-practices/index.html"
          )

          missing=0
          for page in "${required_pages[@]}"; do
            if [[ -f "$page" ]]; then
              echo "✅ Found: $page"
            else
              echo "❌ Missing: $page"
              missing=$((missing + 1))
            fi
          done

          if [[ $missing -gt 0 ]]; then
            echo "⚠️ Warning: $missing expected pages missing"
            echo "Continuing anyway - they may have different paths"
          fi

          # Count total pages
          total_pages=$(find site -name "*.html" | wc -l)
          echo ""
          echo "📊 Total HTML pages generated: $total_pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deployment summary
        run: |
          echo "## 🚀 Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
