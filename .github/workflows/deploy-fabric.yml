# =============================================================================
# Microsoft Fabric Item Deployment using fabric-cicd (GA, Feb 2026)
# =============================================================================
# Deploy Fabric items (notebooks, lakehouses, semantic models) across
# Dev -> Staging -> Production using the fabric-cicd Python library.
#
# Gate model:
#   - push to main              -> dev (dry-run by default, live if dry_run=false)
#   - workflow_dispatch env=dev -> dev
#   - workflow_dispatch env=stg -> staging  (requires environment approval)
#   - workflow_dispatch env=prd -> production (requires environment approval)
#
# Dev/Staging/Production are GitHub Environments. Protection rules
# (required reviewers, wait timers, secrets) MUST be configured there.
# =============================================================================

name: Deploy Fabric Items

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'reports/semantic-model/**'
      - 'reports/report-definitions/**'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment (dev/staging/prod). Required.'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      dry_run:
        description: 'Dry run (preview changes only)'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-fabric-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  FABRIC_CICD_VERSION: '==1.0.0'

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Fabric Items
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install fabric-cicd
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install azure-identity

      - name: Validate item definitions
        run: |
          python -c "from fabric_cicd import FabricWorkspace; print('fabric-cicd import OK')"

      - name: Lint notebook metadata
        run: |
          python scripts/validate_notebook_metadata.py

  # ---------------------------------------------------------------------------
  # Stage 2: Deploy to Dev
  #   - On push to main: always runs, dry-run defaults to true
  #   - On workflow_dispatch with env=dev: runs with user-specified dry-run
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install azure-identity

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Dev workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_DEV_WORKSPACE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          python scripts/fabric-cicd-deploy.py \
            --workspace-id "$FABRIC_WORKSPACE_ID" \
            --environment dev \
            --item-type-in-scope Notebook Lakehouse SemanticModel \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )

  # ---------------------------------------------------------------------------
  # Stage 3: Deploy to Staging (manual only)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install azure-identity

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Staging workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_STAGING_WORKSPACE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python scripts/fabric-cicd-deploy.py \
            --workspace-id "$FABRIC_WORKSPACE_ID" \
            --environment staging \
            --item-type-in-scope Notebook Lakehouse SemanticModel \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )

  # ---------------------------------------------------------------------------
  # Stage 4: Deploy to Production (manual only, requires approval)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install azure-identity

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_PROD_WORKSPACE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python scripts/fabric-cicd-deploy.py \
            --workspace-id "$FABRIC_WORKSPACE_ID" \
            --environment prod \
            --item-type-in-scope Notebook Lakehouse SemanticModel \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )

      - name: Post-deployment smoke test
        run: |
          python scripts/fabric_smoke_test.py \
            --workspace-id "${{ secrets.FABRIC_PROD_WORKSPACE_ID }}"
