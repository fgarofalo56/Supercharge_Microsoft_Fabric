# =============================================================================
# Microsoft Fabric Item Deployment using fabric-cicd (GA, Feb 2026)
# =============================================================================
# Deploy Fabric items (notebooks, lakehouses, semantic models) to the dev
# workspace using the fabric-cicd Python library.
#
# Gate model:
#   - push to main              -> dev (dry-run by default, live if dry_run=false)
#   - workflow_dispatch env=dev -> dev
#
# Only the dev tier exists today: casino-fabric-poc is the sole Fabric
# workspace backing this project. Staging and production jobs were removed
# rather than left as dead config pointing at secrets that were never set.
# To reinstate them, create the workspaces, add FABRIC_STAGING_WORKSPACE_ID /
# FABRIC_PROD_WORKSPACE_ID to the matching GitHub Environments, and restore
# the jobs from git history.
#
# dev is a GitHub Environment. Protection rules (required reviewers, wait
# timers, secrets) MUST be configured there.
# =============================================================================

name: Deploy Fabric Items

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'reports/semantic-model/**'
      - 'reports/report-definitions/**'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment. Only dev exists today.'
        required: true
        type: choice
        options:
          - dev
      dry_run:
        description: 'Dry run (preview changes only)'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-fabric-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  FABRIC_CICD_VERSION: '==1.0.0'
  # Compatible-release pin: accepts 1.25.x patches, blocks 1.26+ minor jumps.
  # Unpinned floats are how the FabricWorkspace token_credential signature
  # change reached CI undetected (see 6c25e91).
  AZURE_IDENTITY_VERSION: '~=1.25.3'

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Fabric Items
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install fabric-cicd
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install "azure-identity${{ env.AZURE_IDENTITY_VERSION }}"

      - name: Validate item definitions
        run: |
          python -c "from fabric_cicd import FabricWorkspace; print('fabric-cicd import OK')"

      - name: Lint notebook metadata
        run: |
          python scripts/validate_notebook_metadata.py

  # ---------------------------------------------------------------------------
  # Stage 2: Deploy to Dev
  #   - On push to main: always runs, dry-run defaults to true
  #   - On workflow_dispatch with env=dev: runs with user-specified dry-run
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install "fabric-cicd${{ env.FABRIC_CICD_VERSION }}"
          pip install "azure-identity${{ env.AZURE_IDENTITY_VERSION }}"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Dev workspace
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_DEV_WORKSPACE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          python scripts/fabric-cicd-deploy.py \
            --workspace-id "$FABRIC_WORKSPACE_ID" \
            --environment dev \
            --item-type-in-scope Notebook Lakehouse SemanticModel \
            $( [ "$DRY_RUN" = "true" ] && echo "--dry-run" )

