name: Run Tests

on:
  push:
    branches:
      - main
    paths:
      - 'data_generation/**'
      - 'validation/**'
      - 'notebooks/**'
      - '*.py'
      - 'requirements*.txt'
  pull_request:
    paths:
      - 'data_generation/**'
      - 'validation/**'
      - 'notebooks/**'
      - '*.py'
      - 'requirements*.txt'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ruff linter
        run: python -m ruff check data_generation/ validation/ --config pyproject.toml --output-format=github

      - name: Run ruff formatter check
        run: python -m ruff format --check --diff data_generation/ validation/

      - name: Run mypy type checking
        env:
          MYPYPATH: data_generation
        run: python -m mypy data_generation/generators/ --ignore-missing-imports --namespace-packages --explicit-package-bases

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run bandit security linter
        run: |
          python -m bandit -r data_generation/generators/ data_generation/open_data/ \
            -c bandit.yml \
            --severity-level medium \
            --format json --output bandit-report.json
          python -m bandit -r data_generation/generators/ data_generation/open_data/ \
            -c bandit.yml \
            --severity-level high

      - name: Run pip-audit dependency scan
        run: python -m pip_audit --strict --desc

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: bandit-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        env:
          PYTHONPATH: data_generation
        run: |
          pytest validation/unit_tests/ \
            -v \
            --tb=short \
            --cov=data_generation \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            htmlcov/

  data-generator-tests:
    name: Data Generator Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test Casino Generators
        env:
          PYTHONPATH: data_generation
        run: |
          python -c "
          from generators.slot_machine_generator import SlotMachineGenerator
          from generators.player_generator import PlayerGenerator
          from generators.financial_generator import FinancialGenerator

          slot_gen = SlotMachineGenerator()
          slots = slot_gen.generate(100)
          assert len(slots) == 100, 'Slot generator failed'
          print('  Slot generator: OK')

          player_gen = PlayerGenerator()
          players = player_gen.generate(50)
          assert len(players) == 50, 'Player generator failed'
          print('  Player generator: OK')

          fin_gen = FinancialGenerator()
          txns = fin_gen.generate(100)
          assert len(txns) == 100, 'Financial generator failed'
          print('  Financial generator: OK')
          "

      - name: Test Federal Generators
        env:
          PYTHONPATH: data_generation
        run: |
          python -c "
          from generators.federal import (
              USDAGenerator, SBAGenerator, NOAAGenerator,
              EPAGenerator, DOIGenerator, DOTFAAGenerator,
              TribalHealthcareGenerator,
          )

          usda = USDAGenerator(seed=42)
          data = usda.generate(10, show_progress=False)
          assert len(data) == 10, 'USDA generator failed'
          print('  USDA generator: OK')

          sba = SBAGenerator(seed=42)
          data = sba.generate(10, show_progress=False)
          assert len(data) == 10, 'SBA generator failed'
          print('  SBA generator: OK')

          noaa = NOAAGenerator(seed=42)
          data = noaa.generate(10, show_progress=False)
          assert len(data) == 10, 'NOAA generator failed'
          print('  NOAA generator: OK')

          epa = EPAGenerator(seed=42)
          data = epa.generate(10, show_progress=False)
          assert len(data) == 10, 'EPA generator failed'
          print('  EPA generator: OK')

          doi = DOIGenerator(seed=42)
          data = doi.generate(10, show_progress=False)
          assert len(data) == 10, 'DOI generator failed'
          print('  DOI generator: OK')

          dot_faa = DOTFAAGenerator(seed=42)
          data = dot_faa.generate(10, show_progress=False)
          assert len(data) == 10, 'DOT/FAA generator failed'
          print('  DOT/FAA generator: OK')

          tribal = TribalHealthcareGenerator(seed=42)
          data = tribal.generate(10, show_progress=False)
          assert len(data) == 10, 'Tribal Healthcare generator failed'
          print('  Tribal Healthcare generator: OK')
          "

      - name: Validate Output Schemas
        run: |
          python -c "
          import json
          from pathlib import Path

          schema_dir = Path('data_generation/schemas')
          for schema_file in schema_dir.glob('*.json'):
              with open(schema_file) as f:
                  schema = json.load(f)
              print(f'  Schema valid: {schema_file.name}')
          "

  open-data-syntax:
    name: Open Data Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Open Data Script Syntax
        run: |
          python -c "
          import py_compile
          from pathlib import Path

          scripts = list(Path('data_generation/open_data').glob('*.py'))
          errors = []

          for script_path in scripts:
              try:
                  py_compile.compile(str(script_path), doraise=True)
                  print(f'  Syntax OK: {script_path.name}')
              except py_compile.PyCompileError as e:
                  errors.append(f'  Syntax error: {script_path} - {e}')

          if errors:
              for e in errors:
                  print(e)
              exit(1)

          print(f'All {len(scripts)} open data scripts have valid syntax')
          "

      - name: Verify Package Imports
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from data_generation.open_data import (
              download_nass_quickstats, download_fsis_recalls,
              download_snap_retailers, download_census_of_agriculture,
              download_ppp_loans, download_7a_504_loans, download_sbir_awards,
              download_weather_observations, download_storm_events,
              download_climate_data, download_tide_data,
              download_air_quality, download_tri_data,
              download_echo_compliance, download_water_quality,
              download_earthquakes, download_water_data,
              download_park_visitation, download_species_data,
              download_hrsa_health_centers, download_ihs_statistics,
              download_cdc_tribal_health, download_cms_medicaid_tribal,
              download_bts_flight_data, download_faa_safety_reports,
              download_faa_airport_data,
          )
          print('All 26 open data download functions importable')
          "

      - name: Validate Federal Dataset Config
        run: |
          python -c "
          import yaml
          with open('data_generation/config/federal_datasets.yaml') as f:
              config = yaml.safe_load(f)
          agencies = config.get('agencies', {})
          print(f'Federal dataset config valid: {len(agencies)} agencies')
          for name in agencies:
              datasets = agencies[name].get('datasets', [])
              print(f'  {name}: {len(datasets)} datasets')
          "

  notebook-validation:
    name: Validate Notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate Notebook Python Syntax
        run: |
          python -c "
          import py_compile
          from pathlib import Path

          # Notebooks are .py files with Databricks magic commands
          notebooks = list(Path('notebooks').rglob('*.py'))
          errors = []

          for nb_path in notebooks:
              try:
                  py_compile.compile(str(nb_path), doraise=True)
                  print(f'  Valid: {nb_path}')
              except py_compile.PyCompileError as e:
                  errors.append(f'  Syntax error: {nb_path} - {e}')

          if errors:
              for e in errors:
                  print(e)
              exit(1)

          print(f'All {len(notebooks)} notebook .py files have valid syntax')
          "

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Integration Tests
        env:
          PYTHONPATH: data_generation
        run: |
          pytest validation/integration_tests/ \
            -v \
            --tb=short \
            -m "integration or pipeline" \
            --junitxml=integration-test-results.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-test-results.xml

  great-expectations:
    name: Data Quality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install great-expectations pandas
          pip install -r requirements.txt

      - name: Generate sample data for validation
        env:
          PYTHONPATH: data_generation
        run: |
          python -c "
          from generators.slot_machine_generator import SlotMachineGenerator
          from generators.player_generator import PlayerGenerator
          from generators.financial_generator import FinancialGenerator
          from generators.federal import USDAGenerator, SBAGenerator
          from pathlib import Path

          output_dir = Path('data_generation/output')
          output_dir.mkdir(parents=True, exist_ok=True)

          # Casino generators
          slot_gen = SlotMachineGenerator(seed=42)
          slot_gen.to_parquet(slot_gen.generate(200, show_progress=False), output_dir / 'bronze_slot_telemetry.parquet')

          player_gen = PlayerGenerator(seed=42)
          player_gen.to_parquet(player_gen.generate(100, show_progress=False), output_dir / 'bronze_player_profiles.parquet')

          fin_gen = FinancialGenerator(seed=42)
          fin_gen.to_parquet(fin_gen.generate(200, show_progress=False), output_dir / 'bronze_financial_transactions.parquet')

          # Federal generators
          usda_gen = USDAGenerator(seed=42)
          usda_gen.to_parquet(usda_gen.generate(100, show_progress=False), output_dir / 'bronze_usda_data.parquet')

          sba_gen = SBAGenerator(seed=42)
          sba_gen.to_parquet(sba_gen.generate(100, show_progress=False), output_dir / 'bronze_sba_data.parquet')

          print('Generated sample data for GE validation')
          "

      - name: Validate GE Suite JSON Files
        run: |
          python -c "
          import json
          from pathlib import Path

          suites = list(Path('validation/great_expectations/expectations').glob('*.json'))
          errors = []
          for suite_path in suites:
              try:
                  with open(suite_path) as f:
                      data = json.load(f)
                  exp_count = len(data.get('expectations', []))
                  print(f'  Valid: {suite_path.name} ({exp_count} expectations)')
              except json.JSONDecodeError as e:
                  errors.append(f'  Invalid JSON: {suite_path.name} - {e}')

          if errors:
              for e in errors:
                  print(e)
              exit(1)

          print(f'All {len(suites)} GE suites are valid JSON')
          "

      - name: Run GE Checkpoints
        run: |
          cd validation/great_expectations

          # Run validation if sample data exists
          if [ -d "../../data_generation/output" ]; then
            great_expectations checkpoint run bronze_checkpoint || echo "No data to validate"
          else
            echo "No sample data found - skipping GE validation"
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-scan, unit-tests, data-generator-tests, open-data-syntax, notebook-validation, integration-tests, great-expectations]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-typecheck.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Generators | ${{ needs.data-generator-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Open Data Scripts | ${{ needs.open-data-syntax.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notebook Validation | ${{ needs.notebook-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data Quality | ${{ needs.great-expectations.result == 'success' && '✅ Passed' || '⚠️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
