name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      location:
        description: 'Azure region'
        required: true
        default: 'eastus2'
        type: string

  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: deploy-infra-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: ${{ inputs.location || 'eastus2' }}
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # NOTE: `az bicep build`/`lint` are purely local compilation — they need
      # no Azure authentication. (Previously this job ran `azure/login`, which
      # made every push to main fail at login when the AZURE_* OIDC secrets are
      # not configured, and spammed a "Deployment Failed" issue each time.)
      - name: Build Bicep
        run: |
          az bicep build --file infra/main.bicep
          echo "✅ Bicep build successful"

      - name: Lint Bicep
        run: |
          az bicep lint --file infra/main.bicep
          echo "✅ Bicep lint passed"

  what-if:
    name: What-If Analysis
    runs-on: ubuntu-latest
    needs: validate
    # Deployment requires Azure OIDC credentials (AZURE_CLIENT_ID / TENANT_ID /
    # SUBSCRIPTION_ID). Until those are configured, run the deploy chain only on
    # explicit manual dispatch — push to main just validates Bicep. This keeps
    # main green and stops the auto-filed "Deployment Failed" issues.
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      changes: ${{ steps.whatif.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run What-If
        id: whatif
        run: |
          set -o pipefail
          RESULT_FILE=$(mktemp)
          if ! az deployment sub what-if \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file infra/main.bicep \
            --parameters infra/environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.bicepparam \
            --no-prompt > "$RESULT_FILE" 2>&1; then
            echo "::error::what-if failed" >&2
            cat "$RESULT_FILE"
            exit 1
          fi

          {
            echo "### What-If Results"
            echo '```'
            cat "$RESULT_FILE"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          if grep -q "Resource changes" "$RESULT_FILE"; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: what-if
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: https://portal.azure.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure
        id: deploy
        run: |
          DEPLOYMENT_NAME="fabric-poc-${{ env.ENVIRONMENT }}-$(date +%Y%m%d-%H%M%S)"

          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file infra/main.bicep \
            --parameters infra/environments/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.bicepparam

          echo "deployment_name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "Deployment: $DEPLOYMENT_NAME" >> $GITHUB_STEP_SUMMARY

      - name: Get Deployment Outputs
        run: |
          az deployment sub show \
            --name ${{ steps.deploy.outputs.deployment_name }} \
            --query "properties.outputs" \
            -o json >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Post-Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify resource group exists
        run: |
          RG="rg-fabricpoc-${{ env.ENVIRONMENT }}"
          az group show --name "$RG" --query "provisioningState" -o tsv | grep -q Succeeded

      - name: Verify Fabric capacity exists and is active
        run: |
          RG="rg-fabricpoc-${{ env.ENVIRONMENT }}"
          STATE=$(az fabric capacity list --resource-group "$RG" --query "[0].properties.state" -o tsv)
          if [ "$STATE" != "Active" ]; then
            echo "::error::Fabric capacity not Active (state=$STATE)"
            exit 1
          fi

      - name: Verify Key Vault reachable
        run: |
          RG="rg-fabricpoc-${{ env.ENVIRONMENT }}"
          KV=$(az keyvault list --resource-group "$RG" --query "[0].name" -o tsv)
          az keyvault show --name "$KV" --query "properties.provisioningState" -o tsv | grep -q Succeeded

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [validate, what-if, deploy, smoke-test]
    # Only raise a tracking issue for real (manual) deployment failures — never
    # for push-triggered validation runs.
    if: failure() && github.event_name == 'workflow_dispatch'
    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Deployment Failed: ${{ env.ENVIRONMENT }} - ${new Date().toISOString()}`;
            const body = `
            ## Deployment Failure

            **Environment:** ${{ env.ENVIRONMENT }}
            **Location:** ${{ env.AZURE_LOCATION }}
            **Workflow Run:** [Link](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Triggered By:** ${{ github.actor }}

            Please investigate and resolve.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment-failure', 'infrastructure']
            });
