# Environment Configuration for Copilot Coding Agent
# Defines the runtime environment when agent executes tasks

# Base environment
base:
  # Operating system preference
  os: "ubuntu-latest"

  # Shell to use
  shell: "bash"

# Language runtimes
runtimes:
  python:
    version: "3.11"
    package_manager: "uv"  # project uses uv
    install_command: "uv pip install -r requirements.txt -r requirements-dev.txt"
    virtual_env: true

  bicep:
    version: "latest"
    install_command: "az bicep install"

# Database services (for integration tests)
services:
  postgres:
    enabled: false
    version: "16"
    port: 5432

  redis:
    enabled: false
    version: "7"
    port: 6379

  mysql:
    enabled: false
    version: "8"
    port: 3306

# Environment variables
# Note: Secrets should be configured via GitHub Secrets, not here
env:
  LOG_LEVEL: "warn"
  CI: "true"
  # PII salt must be provided; agent must not hardcode a fallback
  FABRIC_POC_HASH_SALT: "${FABRIC_POC_HASH_SALT}"

# Pre-task setup commands
setup:
  - name: "Install uv and Python dependencies"
    run: |
      pip install uv
      uv pip install -r requirements.txt -r requirements-dev.txt
      uv pip install -e .

  - name: "Install Azure CLI and Bicep"
    run: |
      if ! command -v az &> /dev/null; then
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      fi
      az bicep install

# Validation commands (run before submitting PR)
validation:
  - name: "Lint"
    run: |
      uv run ruff check .

  - name: "Type check"
    run: |
      uv run mypy data_generation scripts || true

  - name: "Unit tests"
    run: |
      uv run pytest validation/unit_tests/ -v

  - name: "Bicep validation"
    run: |
      az bicep build --file infra/main.bicep

  - name: "Notebook pattern validation"
    run: |
      uv run pytest validation/unit_tests/notebook/ -v

# Post-task cleanup
cleanup:
  - name: "Remove temp files"
    run: |
      rm -rf .tmp .cache __pycache__ *.pyc .pytest_cache

# Resource limits
resources:
  # Maximum memory (MB)
  max_memory: 8192

  # Maximum CPU cores
  max_cpu: 4

  # Maximum disk space (MB)
  max_disk: 20480

# Network access
network:
  # Allow outbound network access (for package installs)
  outbound_allowed: true

  # Allowed domains for network access
  allowed_domains:
    - "pypi.org"
    - "files.pythonhosted.org"
    - "github.com"
    - "aka.ms"
    - "learn.microsoft.com"
    - "registry.npmjs.org"

  # Block these domains
  blocked_domains:
    - "*.local"
