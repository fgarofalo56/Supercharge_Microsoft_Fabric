# GitHub Copilot Coding Agent Configuration
# This file configures how the Copilot coding agent behaves when
# delegated tasks via issues, CLI, or VS Code.

# Agent behavior settings
agent:
  # Maximum number of files the agent can modify per task
  max_files_modified: 25

  # Maximum lines of code changes per task
  max_lines_changed: 800

  # Allow agent to create new files
  allow_file_creation: true

  # Allow agent to delete files
  allow_file_deletion: false

  # Allow agent to modify configuration files
  allow_config_changes: true

  # Require tests for new code
  require_tests: true

  # Minimum test coverage for new code (percentage)
  min_test_coverage: 80

# Boundaries and restrictions
boundaries:
  # Directories the agent can modify
  allowed_paths:
    - "data_generation/**"
    - "notebooks/**"
    - "infra/**"
    - "docs/**"
    - "tutorials/**"
    - "scripts/**"
    - "validation/**"
    - "tests/**"
    - "sample-apps/**"

  # Directories the agent cannot modify
  excluded_paths:
    - ".github/workflows/**"
    - ".github/copilot/**"
    - "output/**"
    - "temp/**"
    - "site/**"
    - "*.lock"
    - "*.env*"

  # File patterns the agent cannot modify
  excluded_patterns:
    - "**/*.pem"
    - "**/*.key"
    - "**/secrets/**"
    - "**/credentials/**"
    - "**/*.parquet"
    - "**/*.csv"
    - "**/*.delta"

  # Maximum file size the agent will modify (KB)
  max_file_size_kb: 200

# Code quality requirements
quality:
  # Run linter before submitting PR
  run_linter: true

  # Run type checker before submitting PR
  run_type_check: true

  # Run tests before submitting PR
  run_tests: true

  # Require all checks to pass
  require_all_checks_pass: true

# Commit settings
commits:
  # Commit message prefix for agent commits
  message_prefix: "feat(agent):"

  # Sign commits (requires configured GPG)
  sign_commits: false

  # Create atomic commits (one per logical change)
  atomic_commits: true

# Pull request settings
pull_request:
  # PR title prefix
  title_prefix: "[Agent]"

  # Add labels to agent PRs
  labels:
    - "agent-generated"
    - "needs-review"

  # Assign reviewers automatically
  auto_assign_reviewers: true

  # Request review from CODEOWNERS
  request_codeowners_review: true

  # Create as draft PR
  draft: true

  # PR body template
  body_template: |
    ## Summary
    {description}

    ## Changes Made
    {changes}

    ## Testing
    - [ ] Unit tests added/updated (`validation/unit_tests/`)
    - [ ] Data generator tests pass (`pytest validation/unit_tests/test_generators.py`)
    - [ ] Bicep validates (`az bicep build --file infra/main.bicep`)
    - [ ] Notebooks pass validation (`pytest validation/unit_tests/notebook/`)
    - [ ] Manual testing performed

    ## Checklist
    - [ ] Code follows project conventions (Bicep/Python/PySpark/KQL)
    - [ ] Documentation updated (`docs/` or `tutorials/`)
    - [ ] No secrets or sensitive data
    - [ ] Microsoft Docs MCP consulted for Fabric/Azure changes
    - [ ] Missing-feature gap logged if applicable

    ---
    *This PR was generated by GitHub Copilot coding agent.*
    *Please review carefully before merging.*

# Environment configuration
environment:
  # Use specific Python version
  python_version: "3.11"

  # Install dev dependencies
  install_dev_dependencies: true

  # Setup commands to run before task
  setup_commands:
    - "pip install uv"
    - "uv pip install -r requirements.txt -r requirements-dev.txt"
    - "uv pip install -e ."

# Timeout settings (in minutes)
timeouts:
  # Maximum time for a single task
  task_max: 45

  # Maximum time for setup
  setup_max: 10

  # Maximum time for tests
  test_max: 20

# Logging and monitoring
logging:
  # Log level for agent output
  level: "info"

  # Include detailed trace logs
  trace: false

  # Log to file
  log_file: ".copilot/agent.log"
