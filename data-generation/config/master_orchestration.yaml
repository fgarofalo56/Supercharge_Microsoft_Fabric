# ---------------------------------------------------------------------------
# Cross-domain relationships
# ---------------------------------------------------------------------------
cross_domain_rules:
  # Player geolocation events should reference valid player IDs
  geolocation_to_players:
    source: "GeolocationGenerator"
    target: "PlayerGenerator"
    relationship: "device_owner references player_id"

  # Video events should reference valid camera zones from security
  video_to_security:
    source: "VideoAnalyticsGenerator"
    target: "SecurityGenerator"
    relationship: "camera zones align with security zones"

  # Compliance filings reference financial transactions
  compliance_to_financial:
    source: "ComplianceGenerator"
    target: "FinancialGenerator"
    relationship: "filing references transaction_id"

# ---------------------------------------------------------------------------
# Output configuration
# ---------------------------------------------------------------------------
output:
  default_format: "parquet"
  supported_formats: ["parquet", "json", "csv"]
  base_path: "output"
  partitioning:
    time_column: "event_timestamp"
    partition_by: "date"
  delta_lake:
    enabled: true
    optimization: "ZORDER"
    vacuum_days: 7
