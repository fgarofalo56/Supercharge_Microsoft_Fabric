# Master Orchestration Configuration
# ===================================
# Coordinates all data generators across casino, federal, streaming, and analytics domains.
# References: generator_config.yaml, federal_datasets.yaml, streaming_sources.yaml

version: "2.0.0"
description: "Supercharge Microsoft Fabric - Unified Data Generation Orchestration"

# ---------------------------------------------------------------------------
# Config file references
# ---------------------------------------------------------------------------
config_files:
  casino: "generator_config.yaml"
  federal: "federal_datasets.yaml"
  streaming: "streaming_sources.yaml"

# ---------------------------------------------------------------------------
# Generation order (dependencies flow top-to-bottom)
# ---------------------------------------------------------------------------
generation_order:
  # Phase 1: Foundation data (no dependencies)
  - stage: 1
    name: "Foundation"
    parallel: true
    generators:
      - generator: "PlayerGenerator"
        domain: "casino"
        depends_on: []
      - generator: "USDAGenerator"
        domain: "federal"
        depends_on: []
      - generator: "SBAGenerator"
        domain: "federal"
        depends_on: []
      - generator: "NOAAGenerator"
        domain: "federal"
        depends_on: []
      - generator: "EPAGenerator"
        domain: "federal"
        depends_on: []
      - generator: "DOIGenerator"
        domain: "federal"
        depends_on: []
      - generator: "TribalHealthcareGenerator"
        domain: "federal"
        depends_on: []
      - generator: "DOTFAAGenerator"
        domain: "federal"
        depends_on: []

  # Phase 2: Casino operations (depend on players)
  - stage: 2
    name: "Casino Operations"
    parallel: true
    generators:
      - generator: "SlotMachineGenerator"
        domain: "casino"
        depends_on: ["PlayerGenerator"]
      - generator: "TableGamesGenerator"
        domain: "casino"
        depends_on: ["PlayerGenerator"]
      - generator: "SecurityGenerator"
        domain: "casino"
        depends_on: []

  # Phase 3: Financial & compliance (depend on operations)
  - stage: 3
    name: "Financial & Compliance"
    parallel: true
    generators:
      - generator: "FinancialGenerator"
        domain: "casino"
        depends_on: ["SlotMachineGenerator", "TableGamesGenerator"]
      - generator: "ComplianceGenerator"
        domain: "casino"
        depends_on: ["FinancialGenerator"]

  # Phase 4: Analytics (depend on operations data)
  - stage: 4
    name: "Analytics"
    parallel: true
    generators:
      - generator: "VideoAnalyticsGenerator"
        domain: "analytics"
        depends_on: ["SecurityGenerator"]
      - generator: "PeopleMovementGenerator"
        domain: "analytics"
        depends_on: []
      - generator: "GeolocationGenerator"
        domain: "analytics"
        depends_on: ["PlayerGenerator"]

