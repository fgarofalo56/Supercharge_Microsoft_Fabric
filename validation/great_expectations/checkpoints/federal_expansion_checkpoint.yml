# Federal Expansion Data Validation Checkpoint
# Validates tribal healthcare and DOT/FAA transportation data
# Covers Wave 4 federal expansion domains
# IMPORTANT: Ensures compliance with HIPAA, IHS, FAA, and DOT reporting standards

name: federal_expansion_checkpoint
config_version: 1.0
template_name:
module_name: great_expectations.checkpoint
class_name: Checkpoint

# Execution behavior
run_name_template: "%Y%m%d-%H%M%S-federal-expansion-validation"

# Action list
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: store_evaluation_params
    action:
      class_name: StoreEvaluationParametersAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      site_names:
        - local_site

# Batch request configuration
batch_request: {}

# Evaluation parameters
evaluation_parameters: {}

# Runtime configuration - stricter for federal compliance
runtime_configuration:
  result_format:
    result_format: COMPLETE
    include_unexpected_rows: true
    partial_unexpected_count: 100
    unexpected_index_column_names:
      - encounter_id
      - record_id

# Validations list - federal expansion domains
validations:
  # Tribal Healthcare Data
  - batch_request:
      datasource_name: federal_bronze
      data_connector_name: runtime_data_connector
      data_asset_name: tribal_healthcare_encounters
      batch_identifiers:
        default_identifier_name: bronze_tribal_healthcare_data
    expectation_suite_name: tribal_healthcare_suite

  # DOT/FAA Transportation Data
  - batch_request:
      datasource_name: federal_bronze
      data_connector_name: runtime_data_connector
      data_asset_name: dot_faa_records
      batch_identifiers:
        default_identifier_name: bronze_dot_faa_data
    expectation_suite_name: dot_faa_suite
