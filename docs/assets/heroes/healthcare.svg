<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Healthcare Analytics</title>
  <desc id="desc">EHR, claims, population health, and HIPAA-compliant analytics on Fabric</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#022C22"/>
      <stop offset="55%"  stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#6EE7B7; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#6EE7B7" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#34D399"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#6EE7B7" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="410" height="34" rx="0" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#34D399"/>
    <text class="h-chip" x="205.0" y="22" text-anchor="middle">HEALTHCARE · CLINICAL &amp; OPERATIONAL</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Healthcare Analytics</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">EHR, claims, population health, and HIPAA-compliant analytics on Fabric</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">EPIC FHIR · HL7 · CLAIMS · CMS HEDIS · HIPAA-COMPLIANT</text>

<g transform="translate(900, 84)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#34D399"/>
      <text class="v-num" x="20" y="22">01</text>
      <text class="v-lbl" x="60" y="22" font-size="14">EHR INGESTION (EPIC FHIR)</text>
      <text class="v-cap" x="60" y="38">Patients, encounters, observations, medications</text>
    </g>

    <g transform="translate(0,64)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#34D399"/>
      <text class="v-num" x="20" y="22">02</text>
      <text class="v-lbl" x="60" y="22" font-size="14">CLAIMS NORMALIZATION</text>
      <text class="v-cap" x="60" y="38">EDI 837/835, denial codes, reimbursement</text>
    </g>

    <g transform="translate(0,128)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#34D399"/>
      <text class="v-num" x="20" y="22">03</text>
      <text class="v-lbl" x="60" y="22" font-size="14">POPULATION HEALTH KPIs</text>
      <text class="v-cap" x="60" y="38">HEDIS measures, risk stratification, cohorts</text>
    </g>

    <g transform="translate(0,192)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#34D399"/>
      <text class="v-num" x="20" y="22">04</text>
      <text class="v-lbl" x="60" y="22" font-size="14">REAL-TIME PATIENT VITALS</text>
      <text class="v-cap" x="60" y="38">IoT bedside monitors → alerts → care team</text>
    </g>
</g>
</svg>