<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Decisions</title>
  <desc id="desc">Architecture decision records, technology selection, and trade-off guides</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#082F49"/>
      <stop offset="55%"  stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#7DD3FC; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#7DD3FC" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#38BDF8"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#7DD3FC" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="360" height="34" rx="0" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#38BDF8"/>
    <text class="h-chip" x="180.0" y="22" text-anchor="middle">DECISIONS · TRADE-OFF MATRICES</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Decisions</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Architecture decision records, technology selection, and trade-off guides</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">FABRIC VS DATABRICKS · DIRECT LAKE VS IMPORT · ETL VS ELT · TOPOLOGY</text>

<g transform="translate(900, 84)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#38BDF8" fill-opacity="0.28" stroke="#38BDF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#38BDF8"/>
      <text class="v-num" x="20" y="22">01</text>
      <text class="v-lbl" x="60" y="22" font-size="14">FABRIC VS DATABRICKS VS SYNAPSE</text>
      <text class="v-cap" x="60" y="38">Platform selection criteria + ownership cost</text>
    </g>

    <g transform="translate(0,64)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#38BDF8" fill-opacity="0.28" stroke="#38BDF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#38BDF8"/>
      <text class="v-num" x="20" y="22">02</text>
      <text class="v-lbl" x="60" y="22" font-size="14">DIRECT LAKE VS IMPORT VS DIRECTQUERY</text>
      <text class="v-cap" x="60" y="38">BI connectivity decision tree</text>
    </g>

    <g transform="translate(0,128)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#38BDF8" fill-opacity="0.28" stroke="#38BDF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#38BDF8"/>
      <text class="v-num" x="20" y="22">03</text>
      <text class="v-lbl" x="60" y="22" font-size="14">LAKEHOUSE VS WAREHOUSE VS SQL DB</text>
      <text class="v-cap" x="60" y="38">Storage engine fit by workload</text>
    </g>

    <g transform="translate(0,192)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#38BDF8" fill-opacity="0.28" stroke="#38BDF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#38BDF8"/>
      <text class="v-num" x="20" y="22">04</text>
      <text class="v-lbl" x="60" y="22" font-size="14">ETL VS ELT VS STREAMING</text>
      <text class="v-cap" x="60" y="38">Ingestion pattern by latency + transform shape</text>
    </g>
</g>
</svg>