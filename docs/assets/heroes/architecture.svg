<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Architecture</title>
  <desc id="desc">Reference architectures, decisions, and best practices for Fabric</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#082F49"/>
      <stop offset="55%"  stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#7DD3FC; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#7DD3FC" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#38BDF8"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#7DD3FC" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="400" height="34" rx="0" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#38BDF8"/>
    <text class="h-chip" x="200.0" y="22" text-anchor="middle">ARCHITECTURE · MEDALLION LAKEHOUSE</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Architecture</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Reference architectures, decisions, and best practices for Fabric</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">ONELAKE · DELTA · DIRECT LAKE · PURVIEW</text>

<g transform="translate(900, 88)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="640" height="64" rx="6" fill="#CD7F32" fill-opacity="0.30" stroke="#CD7F32" stroke-opacity="0.95" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="64" fill="#CD7F32"/>
      <text class="v-num" x="22" y="26" fill="#FFFFFF" font-size="18">BRONZE</text>
      <text class="v-lbl" x="22" y="46" fill="#FFFFFF" fill-opacity="0.75" font-size="12">Raw · append-only</text>
    </g>
<path d="M310,64 L310,82 M306,78 L310,82 L314,78" stroke="#7DD3FC" stroke-width="1.5" fill="none" opacity="0.7"/>

    <g transform="translate(0,84)">
      <rect x="0" y="0" width="640" height="64" rx="6" fill="#C0C0C0" fill-opacity="0.30" stroke="#C0C0C0" stroke-opacity="0.95" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="64" fill="#C0C0C0"/>
      <text class="v-num" x="22" y="26" fill="#FFFFFF" font-size="18">SILVER</text>
      <text class="v-lbl" x="22" y="46" fill="#FFFFFF" fill-opacity="0.75" font-size="12">Cleansed · validated</text>
    </g>
<path d="M310,148 L310,166 M306,162 L310,166 L314,162" stroke="#7DD3FC" stroke-width="1.5" fill="none" opacity="0.7"/>

    <g transform="translate(0,168)">
      <rect x="0" y="0" width="640" height="64" rx="6" fill="#FFD700" fill-opacity="0.30" stroke="#FFD700" stroke-opacity="0.95" stroke-width="1.4"/>
      <rect x="0" y="0" width="6" height="64" fill="#FFD700"/>
      <text class="v-num" x="22" y="26" fill="#FFFFFF" font-size="18">GOLD</text>
      <text class="v-lbl" x="22" y="46" fill="#FFFFFF" fill-opacity="0.75" font-size="12">Aggregated · star</text>
    </g>
</g>
</svg>