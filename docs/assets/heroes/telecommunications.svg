<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Telecom Analytics</title>
  <desc id="desc">Churn prediction, network quality, and customer experience on Fabric</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#1E1B4B"/>
      <stop offset="55%"  stop-color="#5C2D91"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#C4B5FD; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#C4B5FD" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#A78BFA"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#C4B5FD" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="310" height="34" rx="0" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#A78BFA"/>
    <text class="h-chip" x="155.0" y="22" text-anchor="middle">TELECOM · CHURN &amp; NETWORK</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Telecom Analytics</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Churn prediction, network quality, and customer experience on Fabric</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">CDR · NETWORK QoS · CHURN · NPS · CX SCORE</text>

<g transform="translate(900, 84)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#A78BFA" fill-opacity="0.28" stroke="#A78BFA" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#A78BFA"/>
      <text class="v-num" x="20" y="22">01</text>
      <text class="v-lbl" x="60" y="22" font-size="14">CDR INGESTION</text>
      <text class="v-cap" x="60" y="38">Voice + data records at carrier scale</text>
    </g>

    <g transform="translate(0,64)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#A78BFA" fill-opacity="0.28" stroke="#A78BFA" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#A78BFA"/>
      <text class="v-num" x="20" y="22">02</text>
      <text class="v-lbl" x="60" y="22" font-size="14">NETWORK QUALITY ANALYTICS</text>
      <text class="v-cap" x="60" y="38">RAN KPIs, drop rates, throughput by cell</text>
    </g>

    <g transform="translate(0,128)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#A78BFA" fill-opacity="0.28" stroke="#A78BFA" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#A78BFA"/>
      <text class="v-num" x="20" y="22">03</text>
      <text class="v-lbl" x="60" y="22" font-size="14">CHURN PREDICTION</text>
      <text class="v-cap" x="60" y="38">Behavioral + network features → retention offer</text>
    </g>

    <g transform="translate(0,192)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#A78BFA" fill-opacity="0.28" stroke="#A78BFA" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#A78BFA"/>
      <text class="v-num" x="20" y="22">04</text>
      <text class="v-lbl" x="60" y="22" font-size="14">CUSTOMER EXPERIENCE SCORE</text>
      <text class="v-cap" x="60" y="38">Multi-channel NPS rollups with drill-down</text>
    </g>
</g>
</svg>