     role="img" aria-label="Compliance Frameworks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="55%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#5C6BC0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Decorative ambient blobs -->
  <circle cx="180" cy="60"  r="120" fill="#FFC107" opacity="0.20" filter="url(#blur)"/>
  <circle cx="960" cy="280" r="160" fill="#5C6BC0" opacity="0.30" filter="url(#blur)"/>

  <!-- Accent bar on the left -->
  <rect x="0" y="80" width="6" height="160" fill="url(#accent)" rx="3"/>

  <!-- Title + tagline -->
  <text x="56" y="148" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700"
        fill="#FFFFFF" letter-spacing="-0.5">Compliance Frameworks</text>
  <text x="56" y="194" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400"
        fill="rgba(255,255,255,0.85)" letter-spacing="0.2">FedRAMP, HIPAA, SOC 2, PCI DSS, GDPR, NIST 800-53 mapped to Fabric controls</text>

  <!-- Subtle "Microsoft Fabric" eyebrow -->
  <text x="56" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#FFC107" letter-spacing="2" text-transform="uppercase">MICROSOFT FABRIC</text>


