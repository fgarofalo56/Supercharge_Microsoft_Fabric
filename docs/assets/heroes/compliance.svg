<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Compliance Frameworks</title>
  <desc id="desc">FedRAMP, HIPAA, SOC 2, PCI DSS, GDPR, NIST 800-53 mapped to Fabric</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#022C22"/>
      <stop offset="55%"  stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#6EE7B7; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#6EE7B7" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#34D399"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#6EE7B7" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="270" height="34" rx="0" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#34D399"/>
    <text class="h-chip" x="135.0" y="22" text-anchor="middle">COMPLIANCE FRAMEWORKS</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Compliance Frameworks</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">FedRAMP, HIPAA, SOC 2, PCI DSS, GDPR, NIST 800-53 mapped to Fabric</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">FEDRAMP · HIPAA · SOC 2 · PCI DSS · GDPR · NIST 800-53</text>

<g transform="translate(900, 80)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">FEDRAMP</text>
    </g>

    <g transform="translate(172,0)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">HIPAA</text>
    </g>

    <g transform="translate(344,0)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">SOC 2</text>
    </g>

    <g transform="translate(516,0)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">PCI DSS</text>
    </g>

    <g transform="translate(0,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">GDPR</text>
    </g>

    <g transform="translate(172,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">NIST 800-53</text>
    </g>

    <g transform="translate(344,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">MICS</text>
    </g>

    <g transform="translate(516,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">DSAR</text>
    </g>

    <g transform="translate(0,144)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">PURVIEW</text>
    </g>

    <g transform="translate(172,144)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">ENTRA ID</text>
    </g>

    <g transform="translate(344,144)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">KEY VAULT</text>
    </g>

    <g transform="translate(516,144)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#34D399" fill-opacity="0.28" stroke="#34D399" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#34D399"/>
      <text class="v-lbl" x="14" y="35" font-size="11">DEFENDER</text>
    </g>
</g>
</svg>