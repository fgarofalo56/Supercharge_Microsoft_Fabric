  <!-- Subtle "Microsoft Fabric" eyebrow -->
  <text x="56" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#FFC107" letter-spacing="2" text-transform="uppercase">MICROSOFT FABRIC</text>


