  <circle cx="180" cy="60"  r="120" fill="#FFC107" opacity="0.20" filter="url(#blur)"/>
  <circle cx="960" cy="280" r="160" fill="#5C6BC0" opacity="0.30" filter="url(#blur)"/>

  <!-- Accent bar on the left -->
  <rect x="0" y="80" width="6" height="160" fill="url(#accent)" rx="3"/>

  <!-- Title + tagline -->
  <text x="56" y="148" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700"
        fill="#FFFFFF" letter-spacing="-0.5">Retail and CPG Analytics</text>
  <text x="56" y="194" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400"
        fill="rgba(255,255,255,0.85)" letter-spacing="0.2">Demand forecasting, customer segmentation, and store ops on Fabric</text>

  <!-- Subtle "Microsoft Fabric" eyebrow -->
  <text x="56" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#FFC107" letter-spacing="2" text-transform="uppercase">MICROSOFT FABRIC POC</text>


