  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Foundation, data engineering, AI, real-time, governance, and ops</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">FABRIC IQ · DIRECT LAKE · MIRRORING · COPILOT · RTI</text>

