      <rect x="0" y="0" width="4" height="60" fill="#94A3B8"/>
      <text class="v-lbl" x="14" y="35" font-size="11">IR INCIDENT</text>
    </g>

    <g transform="translate(172,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#94A3B8" fill-opacity="0.28" stroke="#94A3B8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#94A3B8"/>
      <text class="v-lbl" x="14" y="35" font-size="11">RA RISK</text>
    </g>

    <g transform="translate(344,72)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#94A3B8" fill-opacity="0.28" stroke="#94A3B8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#94A3B8"/>
      <text class="v-lbl" x="14" y="35" font-size="11">SC SYSTEM PROTECT</text>
    </g>

    <g transform="translate(516,72)">
