<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">NIST 800-53 on Microsoft Fabric</title>
  <desc id="desc">20 control families mapped to Fabric, Azure, and Microsoft 365 services</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="55%"  stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#94A3B8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#E2E8F0; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#E2E8F0" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#94A3B8"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#E2E8F0" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="350" height="34" rx="0" fill="#94A3B8" fill-opacity="0.10" stroke="#94A3B8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#94A3B8"/>
    <text class="h-chip" x="175.0" y="22" text-anchor="middle">NIST 800-53 · CONTROL CATALOG</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">NIST 800-53 on Microsoft Fabric</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">20 control families mapped to Fabric, Azure, and Microsoft 365 services</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">AC · AT · AU · CA · CM · CP · IA · IR · MA · MP · PE · PL · PS · RA · SA · SC · SI · SR</text>

<g transform="translate(900, 80)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="160" height="60" rx="4" fill="#94A3B8" fill-opacity="0.28" stroke="#94A3B8" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="60" fill="#94A3B8"/>
      <text class="v-lbl" x="14" y="35" font-size="11">AC ACCESS CONTROL</text>
