<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Runbooks</title>
  <desc id="desc">On-call playbooks for capacity, refresh, DR, security, and quality incidents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#4C0519"/>
      <stop offset="55%"  stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#FB7185" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#FDA4AF; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#FDA4AF" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#FB7185"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#FDA4AF" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="340" height="34" rx="0" fill="#FB7185" fill-opacity="0.10" stroke="#FB7185" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#FB7185"/>
    <text class="h-chip" x="170.0" y="22" text-anchor="middle">RUNBOOKS · INCIDENT RESPONSE</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Runbooks</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">On-call playbooks for capacity, refresh, DR, security, and quality incidents</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">DETECT → TRIAGE → MITIGATE → RESOLVE → POSTMORTEM</text>

<g transform="translate(900, 84)">

    <g transform="translate(0,0)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#FB7185" fill-opacity="0.28" stroke="#FB7185" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#FB7185"/>
      <text class="v-num" x="20" y="22">01</text>
      <text class="v-lbl" x="60" y="22" font-size="14">CAPACITY THROTTLING RESPONSE</text>
      <text class="v-cap" x="60" y="38">Detect → scale → reroute load</text>
    </g>

    <g transform="translate(0,64)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#FB7185" fill-opacity="0.28" stroke="#FB7185" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#FB7185"/>
      <text class="v-num" x="20" y="22">02</text>
      <text class="v-lbl" x="60" y="22" font-size="14">FAILED REFRESH TRIAGE</text>
      <text class="v-cap" x="60" y="38">Semantic-model + dataflow refresh diagnostics</text>
    </g>

    <g transform="translate(0,128)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#FB7185" fill-opacity="0.28" stroke="#FB7185" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#FB7185"/>
      <text class="v-num" x="20" y="22">03</text>
      <text class="v-lbl" x="60" y="22" font-size="14">DR EXECUTION + MULTI-REGION FAILOVER</text>
      <text class="v-cap" x="60" y="38">RPO/RTO playbooks with verification</text>
    </g>

    <g transform="translate(0,192)">
      <rect x="0" y="0" width="640" height="50" rx="5" fill="#FB7185" fill-opacity="0.28" stroke="#FB7185" stroke-opacity="0.95" stroke-width="1.2"/>
      <rect x="0" y="0" width="6" height="50" fill="#FB7185"/>
      <text class="v-num" x="20" y="22">04</text>
      <text class="v-lbl" x="60" y="22" font-size="14">SECURITY INCIDENT RESPONSE</text>
      <text class="v-cap" x="60" y="38">Contain → eradicate → recover → review</text>
    </g>
</g>
</svg>