<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Supercharge Microsoft Fabric</title>
  <desc id="desc">Enterprise reference for architecture, migrations, AI, and governance</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%"   stop-color="#0B1226"/>
      <stop offset="55%"  stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h-title { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:600; font-size:54px; fill:#FFFFFF; letter-spacing:-1.0px; }
      .h-sub   { font-family:'IBM Plex Sans','Segoe UI','Helvetica Neue',sans-serif; font-weight:400; font-size:20px; fill:#FFFFFF; fill-opacity:0.84; letter-spacing:-0.2px; }
      .h-chip  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:13px; letter-spacing:2.5px; fill:#A5B4FC; }
      .h-foot  { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; letter-spacing:1.2px; fill:#FFFFFF; fill-opacity:0.45; }
      .v-num   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:700; font-size:15px; fill:#FFFFFF; letter-spacing:0.5px; }
      .v-lbl   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:600; font-size:13px; fill:#FFFFFF; fill-opacity:0.95; letter-spacing:0.8px; }
      .v-cap   { font-family:'JetBrains Mono','SF Mono','Consolas',monospace; font-weight:500; font-size:11px; fill:#FFFFFF; fill-opacity:0.75; letter-spacing:1.0px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="6" height="420" fill="#A5B4FC" opacity="0.65"/>
  <rect x="0" y="0" width="6" height="120" fill="#818CF8"/>

  <!-- Bottom scan line -->
  <rect x="0" y="408" width="1600" height="2" fill="#A5B4FC" opacity="0.25"/>

  <!-- Eyebrow chip -->
  <g transform="translate(72, 60)">
    <rect x="0" y="0" width="450" height="34" rx="0" fill="#818CF8" fill-opacity="0.10" stroke="#818CF8" stroke-opacity="0.55"/>
    <rect x="0" y="0" width="6" height="34" fill="#818CF8"/>
    <text class="h-chip" x="225.0" y="22" text-anchor="middle">MICROSOFT FABRIC · ENTERPRISE REFERENCE</text>
  </g>

  <!-- Title -->
  <text class="h-title" x="72" y="208">Supercharge Microsoft Fabric</text>

  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Enterprise reference for architecture, migrations, AI, and governance</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">F64 CAPACITY · 333 PAGES · 56 TUTORIALS · 26 FEATURES</text>


  <!-- Right viz: Microsoft Fabric platform stack -->
  <g transform="translate(900, 56)">
    <!-- Top: workloads row -->
    <g transform="translate(0, 0)">
      <rect x="0"   y="0" width="148" height="78" rx="6" fill="#818CF8" fill-opacity="0.30" stroke="#818CF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <text class="v-num" x="14" y="22">01</text>
      <text class="v-lbl" x="14" y="46">DATA</text>
      <text class="v-lbl" x="14" y="62">FACTORY</text>

      <rect x="170" y="0" width="148" height="78" rx="6" fill="#818CF8" fill-opacity="0.30" stroke="#818CF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <text class="v-num" x="184" y="22">02</text>
      <text class="v-lbl" x="184" y="46">DATA</text>
      <text class="v-lbl" x="184" y="62">ENGINEERING</text>

      <rect x="340" y="0" width="148" height="78" rx="6" fill="#818CF8" fill-opacity="0.30" stroke="#818CF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <text class="v-num" x="354" y="22">03</text>
      <text class="v-lbl" x="354" y="46">REAL-TIME</text>
      <text class="v-lbl" x="354" y="62">INTELLIGENCE</text>

      <rect x="510" y="0" width="148" height="78" rx="6" fill="#818CF8" fill-opacity="0.30" stroke="#818CF8" stroke-opacity="0.95" stroke-width="1.2"/>
      <text class="v-num" x="524" y="22">04</text>
      <text class="v-lbl" x="524" y="46">POWER BI</text>
      <text class="v-lbl" x="524" y="62">+ AI</text>
    </g>

    <!-- Connector arrows down -->
    <g stroke="#A5B4FC" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M74,80 L74,108"/>
      <path d="M244,80 L244,108"/>
      <path d="M414,80 L414,108"/>
      <path d="M584,80 L584,108"/>
    </g>

    <!-- Middle: OneLake foundation -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="658" height="68" rx="6" fill="#A5B4FC" fill-opacity="0.32" stroke="#A5B4FC" stroke-opacity="0.95" stroke-width="1.2"/>
      <text class="v-num" x="14" y="24">00</text>
      <text class="v-lbl" x="14" y="48" font-size="14">ONELAKE  ·  DELTA  ·  ICEBERG  ·  SHORTCUTS</text>
    </g>

    <!-- Bottom: governance band -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="658" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text class="v-cap" x="14" y="28">MICROSOFT PURVIEW  ·  ENTRA ID  ·  KEY VAULT  ·  DEFENDER  ·  F64 CAPACITY</text>
    </g>
  </g>

</svg>