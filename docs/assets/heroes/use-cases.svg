  <!-- Tagline -->
  <text class="h-sub" x="72" y="252">Applied analytics for healthcare, finance, retail, manufacturing, federal</text>

  <!-- Footer chip -->
  <text class="h-foot" x="72" y="385">HEALTHCARE · FINANCE · MANUFACTURING · RETAIL · ENERGY · FEDERAL</text>

