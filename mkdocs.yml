# MkDocs Configuration for Supercharge Microsoft Fabric
# https://squidfunk.github.io/mkdocs-material/

# NOTE: site_name drives the browser <title>, the OG/Twitter card site_name,
# and the navbar logo title — keep it spelled "Supercharge" (one p). The repo
# was renamed from Suppercharge_Microsoft_Fabric to Supercharge_Microsoft_Fabric
# on 2026-09-03 (GitHub issue #105); GitHub auto-redirects the old slug for
# both web and git-clone traffic indefinitely.
site_name: Supercharge Microsoft Fabric
site_description: >-
  A personal, community reference for Microsoft Fabric — a casino & gaming
  analytics POC that bridges to Tribal Nations and federal agency data domains.
  Not an official Microsoft product.
site_author: Frank Garofalo
site_url: https://fgarofalo56.github.io/Supercharge_Microsoft_Fabric/

# Repository
repo_name: Supercharge_Microsoft_Fabric
repo_url: https://github.com/fgarofalo56/Supercharge_Microsoft_Fabric
edit_uri: edit/main/docs/

# Copyright
copyright: >-
  Copyright &copy; 2026 Supercharge Microsoft Fabric &middot;
  <a href="https://github.com/fgarofalo56/Supercharge_Microsoft_Fabric">GitHub</a> &middot;
  <a href="https://github.com/fgarofalo56/Supercharge_Microsoft_Fabric/issues">Issues</a> &middot;
  <a href="https://fgarofalo56.github.io/Supercharge_Microsoft_Fabric/field-questions/">Field Questions</a>

# Documentation directory (default: docs/)
docs_dir: docs

# Link validation — surfaces the off-site / .md / 404 / bad-anchor class of bug
# at build time. Kept at `warn` (deploy does not use --strict) so the build
# never fails; warnings show in the Actions log. `absolute_links: warn` flags
# any internal link that should be relative (e.g. a github.com/blob URL).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Theme Configuration
theme:
  name: material
  custom_dir: overrides
  language: en
  
  # Color palette with dark/light toggle
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Features
  features:
    # - navigation.instant   # disabled — was racing extra_javascript / mermaid
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  
  # Custom logo + favicon — see docs/assets/images/{logo,favicon}.svg
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

# Hooks (post-build mutations) — order matters; runs in YAML order.
hooks:
  - hooks/unwrap_mermaid.py
  - hooks/page_polish.py

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        # Renamed from SCREAMING_SNAKE to kebab-case (#106)
        ARCHITECTURE.md: architecture.md
        BEST_PRACTICES.md: best-practices.md
        BICEP_MODULES.md: bicep-modules.md
        CHEAT_SHEETS.md: cheat-sheets.md
        COST_ESTIMATION.md: cost-estimation.md
        DECISION_TREES.md: decision-trees.md
        DEPLOYMENT.md: deployment.md
        DISASTER_RECOVERY.md: disaster-recovery.md
        FAQ.md: faq.md
        FIELD_QUESTIONS.md: field-questions.md
        GENERATOR_API_REFERENCE.md: generator-api-reference.md
        GLOSSARY.md: glossary.md
        MIGRATION_AND_RTI_RESEARCH.md: migration-and-rti-research.md
        MY_RESOURCES.md: my-resources.md
        NETWORKING.md: networking.md
        PREREQUISITES.md: prerequisites.md
        QUICK_START.md: quick-start.md
        SECURITY.md: security.md
        STYLE_GUIDE.md: style-guide.md
        TROUBLESHOOTING_MATRIX.md: troubleshooting-matrix.md
        VISUAL_STANDARDS.md: visual-standards.md
        best-practices/01_WORKSPACES_NAMING.md: best-practices/01-workspaces-naming.md
        best-practices/02_DATA_GATEWAY.md: best-practices/02-data-gateway.md
        best-practices/03_PIPELINES_DATA_MOVEMENT.md: best-practices/03-pipelines-data-movement.md
        best-practices/04_METADATA_DRIVEN_PIPELINES.md: best-practices/04-metadata-driven-pipelines.md
        best-practices/05_SPARK_NOTEBOOKS.md: best-practices/05-spark-notebooks.md
        best-practices/06_DATAFLOWS.md: best-practices/06-dataflows.md
        best-practices/07_LAKEHOUSE_SETUP.md: best-practices/07-lakehouse-setup.md
        best-practices/08_WAREHOUSE_SETUP.md: best-practices/08-warehouse-setup.md
        best-practices/09_SOURCE_SPECIFIC_PATTERNS.md: best-practices/09-source-specific-patterns.md
        best-practices/10_DECISION_GUIDE.md: best-practices/10-decision-guide.md
        best-practices/11_ORACLE_GATEWAY_TROUBLESHOOTING.md: best-practices/11-oracle-gateway-troubleshooting.md
        compliance-templates/CTR_TEMPLATE.md: compliance-templates/ctr-template.md
        compliance-templates/MICS_TEMPLATE.md: compliance-templates/mics-template.md
        compliance-templates/SAR_TEMPLATE.md: compliance-templates/sar-template.md
        compliance-templates/W2G_TEMPLATE.md: compliance-templates/w2g-template.md

# Markdown Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS/JS
extra_css:
  - stylesheets/extra.css
  - stylesheets/copilot-chat.css
  - stylesheets/docs.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/dark-mode-auto.js
  - javascripts/copilot-chat.js

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fgarofalo56/Supercharge_Microsoft_Fabric
      name: GitHub Repository
  
  generator: false

